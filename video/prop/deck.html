<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Q3_strategy_FINAL_v7_REAL</title>
<!--
  A prop for the phone clips: the boring deck the speaker stands in front of. Same template as the animated
  satire in src/live/deck.tsx. Open full screen on the projector (press F).
  Keys: right arrow, page down, space or a clicker go forward; left arrow or page up go back.
  Rigged: forward from slide 5 lands on slide 17, for the wrong-slide clip. Start on a slide with #4 in the URL.
-->
<style>
  html, body { margin: 0; height: 100%; background: #000; cursor: none; }
  .slide {
    position: fixed; inset: 0; margin: auto; aspect-ratio: 16 / 9; max-width: 100vw; max-height: 100vh;
    background: linear-gradient(160deg, #eef2f7 0%, #c6d3e2 100%);
    font-family: Arial, Helvetica, sans-serif; color: #333; box-sizing: border-box; padding: 4.7% 6.25%;
    container-type: inline-size;
  }
  h1 { margin: 0; font-size: 3.4cqw; color: #1f3a5f; }
  .rule { height: 0.32cqw; width: 11.5cqw; background: #3a6ea5; margin-top: 1.2cqw; }
  .centred h1 { text-align: center; margin-top: 15cqw; font-size: 5cqw; }
  .centred .rule { margin: 1.5cqw auto 0; width: 19cqw; }
  .by { text-align: center; font-size: 2cqw; color: #5b6b7f; margin-top: 1.4cqw; }
  ul { margin: 2.2cqw 0 0; padding-left: 2.2cqw; font-size: 1.9cqw; line-height: 1.5; }
  .wall ul { font-size: 1.38cqw; line-height: 1.26; }
  li.sub { margin-left: 2.3cqw; list-style-type: circle; }
  footer { position: absolute; left: 3.1cqw; right: 3.1cqw; bottom: 1.6cqw; display: flex; justify-content: space-between; font-size: 1.15cqw; color: #7a8899; }
</style>
</head>
<body>
<div class="slide" id="slide"></div>
<script>
  const TOTAL = 87;
  const WALL = [
    "Leverage cross-functional synergies to drive alignment across all key stakeholder groups",
    "  Ensure holistic, best-in-class value creation going forward",
    "  Circle back on actionable learnings from the Q2 deep dives",
    "Optimise the go-to-market motion for scalable, sustainable growth",
    "  Deliver on the north star metrics (see appendix B, slides 44 to 61)",
    "  Revisit the roadmap in light of evolving market dynamics",
    "Empower teams to own outcomes, not outputs, in an agile way",
    "  Socialise the framework with leadership before the offsite",
    "  Align on next steps, owners and timelines (to be decided)",
    "Move the needle on customer-centric innovation at pace",
    "  Unlock efficiencies through strategic process re-engineering",
    "  Benchmark against peers and adjacent verticals where relevant",
    "Questions? Please hold them until the end of the presentation",
  ];
  const SLIDES = {
    1: { title: "Q3 Strategy Update", centred: true },
    2: { title: "AGENDA", centred: true },
    3: { title: "Agenda (cont.)", bullets: ["Where we are", "Where we are going", "How we get there", "Next steps", "Q&A"] },
    // Twice the list, so it fills the slide and reads as a wall from the back of the room.
    4: { title: "Key takeaways (1 of 4)", bullets: [...WALL, ...WALL.slice(0, 10).map((b) => `${b} (cont.)`)], wall: true },
    5: { title: "Market overview", bullets: ["The market is growing", "Competition is increasing", "We need to move fast", "More on the next slide"] },
    17: { title: "Appendix B: Methodology (cont.)", bullets: WALL.slice().reverse(), wall: true },
  };
  // Forward from 5 lands on 17: the clicker "skipped" twelve slides.
  const NEXT = { 5: 17 };
  let page = Math.min(TOTAL, Math.max(1, Number(location.hash.slice(1)) || 1));

  const escape = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  function draw() {
    const s = SLIDES[page] ?? { title: `Section ${page}`, bullets: ["Details to follow", "  See appendix", "Discuss offline"] };
    const el = document.getElementById("slide");
    el.className = `slide${s.centred ? " centred" : ""}${s.wall ? " wall" : ""}`;
    const list = s.bullets ? `<ul>${s.bullets.map((b) => `<li class="${b.startsWith("  ") ? "sub" : ""}">${escape(b.trim())}</li>`).join("")}</ul>` : "";
    el.innerHTML = `<h1>${escape(s.title)}</h1><div class="rule"></div>${s.centred && page === 1 ? '<div class="by">Presented by: [Your name]</div>' : ""}${list}<footer><span>Company confidential</span><span>${page} / ${TOTAL}</span></footer>`;
    history.replaceState(null, "", `#${page}`);
  }
  addEventListener("keydown", (e) => {
    if (["ArrowRight", "PageDown", " ", "Enter", "ArrowDown"].includes(e.key)) page = Math.min(TOTAL, NEXT[page] ?? page + 1);
    else if (["ArrowLeft", "PageUp", "Backspace", "ArrowUp"].includes(e.key)) page = Math.max(1, page - 1);
    else if (e.key === "Home") page = 1;
    else if (e.key === "f" || e.key === "F") document.documentElement.requestFullscreen?.();
    else return;
    e.preventDefault();
    draw();
  });
  draw();
</script>
</body>
</html>
